[package]
name = "lithe-java-backend"
description = "Plugin backend process of the Lithe Java Support plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lithe-java-backend"
path = "src/main.rs"

[dependencies]
lithe-java-domain = { path = "../crates/java-domain" }
# Pinned to the published Rust SDK release; ../sdk.lock.json records the
# matching commit, crate archive and SHA-256; scripts/verify-sdk-lock.sh
# checks that Cargo.lock resolved this exact commit.
lithe-plugin-sdk = { git = "https://github.com/Lithe-IDEA/lithe-plugin-docs", tag = "sdk-rust-v0.2.0" }
serde_json.workspace = true
