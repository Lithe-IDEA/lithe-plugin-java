[workspace]
members = ["backend", "crates/java-domain"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
