name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release with
# one unsigned plugin archive per macOS architecture and its SHA-256 file.
#
# No step receives a signing key. Checkouts do not keep the workflow token.
#
# Releases stay pre-releases, which Lithe Store's tracker skips, for three
# reasons:
#   1. Lithe still bundles Java Support under the old ID
#      dev.lithe.plugin.java-support.
#   2. Current Lithe hosts reserve languageServers[].hostIntegration (the JDT
#      integration) to dev.lithe.* plugin IDs and accept the short tool ID
#      "java" only from verified official provenance, so they reject this
#      package.
#   3. The backend links Rust plugin SDK 0.2.0, which requires the host to
#      offer litheLogging 1 and refuses to start without it. Only the latest
#      Lithe preview offers it so far; no stable Lithe does.
# Remove --prerelease below once a stable Lithe accepts the package (stage E in
# MIGRATION.md), stops bundling Java Support, and offers litheLogging 1 (Rust
# SDK 0.2.0 requires it). The Store then lists stable releases of this
# repository automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the pinned plugin SDK release
        run: scripts/verify-sdk-lock.sh --download

  release:
    name: Publish ${{ github.ref_name }}
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the tag matches plugin.json
        run: |
          set -euo pipefail
          version=$(plutil -extract version raw -o - io.github.lithe-idea.java-support/plugin.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi
      - name: Build and verify both architectures
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            scripts/build-package.sh --arch "$arch"
          done
      - name: Archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checksums="$RUNNER_TEMP/checksums.txt"
          : > "$checksums"
          for arch in arm64 x86_64; do
            scripts/archive-package.sh --package ".artifacts/package/$arch/io.github.lithe-idea.java-support" \
              --arch "$arch" >> "$checksums"
          done
          {
            echo "Java Support（\`io.github.lithe-idea.java-support\`）${GITHUB_REF_NAME#v}。每个 macOS 架构一个归档，附 SHA-256 文件。"
            echo
            echo "兼容性：目前的 Lithe 仍内置 Java Support，并且只允许 \`dev.lithe.*\` 插件使用 JDT 宿主集成和短工具 ID \`java\`，所以会拒绝安装这个包；要等 Lithe 主仓库完成 Java 拆分的阶段 E。"
            echo
            echo "安装：预发布版本，Lithe Store 自动追踪会跳过。宿主支持后下载对应架构的 ZIP，在 设置 → 插件 的 ⚙ 菜单中选择 从磁盘安装插件…。"
            echo
            echo "SHA-256："
            echo '```'
            sed 's#  dist/#  #' "$checksums"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --verify-tag --prerelease \
            --title "Java Support $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
