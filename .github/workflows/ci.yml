name: CI

# Draft pull requests only run the Linux checks. The macOS package job starts
# when a pull request is ready for review and on every push to main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test package notices
        run: node --test --test-timeout=60000 scripts/package/collect-notices.test.mjs
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the pinned plugin SDK release
        run: scripts/verify-sdk-lock.sh --download

  package:
    name: Build and verify the macOS packages
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/assemble-package.sh compiles the plugin backend for each
      # architecture it packages.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Downloads are named by their SHA-256 and verified again before use.
      - name: Restore verified third-party downloads
        uses: actions/cache@v4
        with:
          path: |
            .artifacts/jdtls-downloads
            .artifacts/jdk-downloads
          key: third-party-${{ hashFiles('third_party/*/manifest.json') }}
      - name: Build, verify and archive both architectures
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            package=$(scripts/build-package.sh --arch "$arch")
            scripts/archive-package.sh --package "$package" --arch "$arch"
          done
      - name: Upload the archives
        uses: actions/upload-artifact@v4
        with:
          name: java-support-archives
          path: dist/
          retention-days: 7
          if-no-files-found: error
